<style>
@font-face{font-family:Manrope;src:url('/fonts/manrope-variable-latin.woff2') format('woff2');font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#080a0c;color:#f2f3f4;font:14px Manrope,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;--panel:#15191d;--line:#ffffff1c;--muted:#a0a7ae;--ink:#f2f3f4;--accent:#a78bfa}body.light{--panel:#f8f9fa;--line:#171d2620;--muted:#59636d;--ink:#15191d;background:#eef0f2;color:var(--ink)}button,a{font:inherit;color:inherit}button{cursor:pointer;transition:background .18s,transform .18s}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.shell{width:min(1280px,100%);margin:auto;padding:28px 40px 24px}header{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.wordmark{font-size:17px;letter-spacing:-.5px;font-weight:650;text-decoration:none}.wordmark span{color:var(--muted);font-weight:400;font-size:13px;margin-left:14px;letter-spacing:0}.theme{display:flex;gap:3px;border:1px solid var(--line);padding:3px;border-radius:30px}.theme button{border:0;background:none;border-radius:24px;padding:8px 14px;color:var(--muted)}.theme button[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.stage{position:relative;height:clamp(390px,66vh,690px);margin:20px -20px 0;border-radius:24px;overflow:hidden}.stage canvas{display:block;width:100%;height:100%;touch-action:none}.hint{position:absolute;bottom:17px;left:0;right:0;text-align:center;pointer-events:none;font-size:12px;color:var(--muted)}.error{position:absolute;inset:0;display:grid;place-content:center;padding:30px;text-align:center}.error[hidden]{display:none}.tools{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:26px 0 8px;border-top:1px solid var(--line)}.colors{display:flex;gap:12px;align-items:center}.swatch{width:34px;height:34px;padding:7px;border:1px solid transparent;border-radius:50%;background:transparent}.swatch span{display:block;border-radius:50%;width:100%;height:100%;background:var(--color);box-shadow:0 0 12px color-mix(in srgb,var(--color),transparent 65%)}.swatch[aria-pressed=true]{border-color:var(--ink)}.actions{display:flex;align-items:center;gap:8px}.actions button{min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}.actions button[aria-pressed=true]{border-color:var(--muted)}.actions button:hover{background:color-mix(in srgb,var(--panel),var(--ink) 7%)}.actions button:active{transform:scale(.98)}.footer{display:flex;justify-content:space-between;gap:18px;padding-top:20px;color:var(--muted);font-size:12px}.footer p{margin:0}.footer a{text-decoration:none}

</style>
