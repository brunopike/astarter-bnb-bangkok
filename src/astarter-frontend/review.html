<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIVE · 视口验收</title><style>html{background:#111c27;color:#b0cbdc;font:11px system-ui}body{margin:15px}header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:13px;line-height:1.9}a{color:#b7d7e9;text-underline-offset:4px}#frame-wrap{position:relative}iframe{display:block;border:0;transform-origin:top left;background:#080c11}#metrics{font:10px/1.9 ui-monospace,monospace;color:#8aaabe;white-space:pre-wrap;margin:10px 0 0}</style></head><body><header><strong>HIVE 视口验收</strong><a href="?mode=mobile">390 手机</a><a href="?mode=narrow">360 手机</a><a href="?mode=desktop">1440 桌面</a><a href="?mode=compact">1084 桌面</a><a href="?mode=mobile&motion=reduced">低动态</a><a href="/">样片 ↗</a></header><nav aria-label="验收操作"><button data-proxy="play-pause">暂停 / 继续</button><button data-proxy="step">单步 +3s</button><button data-proxy="replay">重播</button><button data-theme="light">浅色</button><button data-theme="dark">深色</button><button data-inject="market">注入行情信号</button><button data-pane="console">操作台</button><button data-pane="network">动效</button></nav><div id="frame-wrap"><iframe id="preview" title="蜂巢样片实际响应式视口" src="/"></iframe></div><p id="metrics">等待实际视口渲染…</p><script>
const p=new URLSearchParams(location.search),sizes={mobile:[390,844],narrow:[360,740],desktop:[1440,900],compact:[1084,610]},size=sizes[p.get('mode')]||sizes.mobile,f=document.getElementById('preview'),wrap=document.getElementById('frame-wrap');f.style.width=size[0]+'px';f.style.height=size[1]+'px';const target=new URLSearchParams();for(const key of ['motion','renderer','scene'])if(p.has(key))target.set(key,p.get(key));f.src='/'+(target.size?'?'+target:'');
function fit(){const top=wrap.getBoundingClientRect().top,scale=Math.min(1,(innerWidth-30)/size[0],Math.max(220,innerHeight-top-90)/size[1]);f.style.transform='scale('+scale+')';wrap.style.width=size[0]*scale+'px';wrap.style.height=size[1]*scale+'px';}
addEventListener('resize',fit);fit();
document.querySelectorAll('[data-proxy]').forEach(b=>b.onclick=()=>f.contentDocument?.getElementById(b.dataset.proxy)?.click());
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>f.contentDocument?.querySelector('[data-theme-choice="'+b.dataset.theme+'"]')?.click());
document.querySelector('[data-inject]').onclick=()=>f.contentDocument?.querySelector('[data-inject="market"]')?.click();
document.querySelectorAll('[data-pane]').forEach(b=>b.onclick=()=>f.contentDocument?.querySelector('[data-mobile-pane="'+b.dataset.pane+'"]')?.click());
setInterval(()=>{try{const d=f.contentDocument,w=f.contentWindow,visible=x=>x&&w.getComputedStyle(x).display!=='none'&&w.getComputedStyle(x).visibility!=='hidden',panels=['.status-panel','.network-stage','.console-panel'].map(s=>{const el=d.querySelector(s),r=el?.getBoundingClientRect();return visible(el)?Math.round(r.width):0;}),dock=d.querySelector('.run-dock')?.getBoundingClientRect(),main=d.querySelector('.workspace')?.getBoundingClientRect();document.getElementById('metrics').textContent='实际视口 '+w.innerWidth+' × '+w.innerHeight+' / 横向溢出 '+Math.max(0,d.documentElement.scrollWidth-w.innerWidth)+'px\n左 / 中 / 右 '+panels.join(' / ')+'px · '+d.body.dataset.mobileView+' · '+d.body.dataset.scene+'\n运行 '+d.body.dataset.scenario+' · '+d.body.dataset.participants+' Agent · '+d.body.dataset.simTime+'s\n底部操作 '+(dock&&main&&dock.bottom<=main.bottom+1?'可达':'隐藏或待显示');}catch{}},300);
</script></body></html>
