[project]
name = "astarter-public-backend"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "uvicorn==0.52.4",
  "psycopg[binary]==3.3.7",
  "psycopg-pool==3.3.3",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "app:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
