name: Market data and social feeds
on:
  push:
    paths:
      - 'src/astarter-frontend/**'
      - '.github/workflows/market-data.yml'
  pull_request:
    paths:
      - 'src/astarter-frontend/**'
      - '.github/workflows/market-data.yml'
permissions:
  contents: read
jobs:
  market-data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/astarter-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/astarter-frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
