name: Publish product demo

on:
  push:
    branches: [main]
    paths:
      - docs/demo/**
      - .github/workflows/product-demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-demo-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: docs/demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/demo
      - uses: actions/deploy-pages@v4
        id: deployment
