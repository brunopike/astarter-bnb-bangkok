name: Refresh public Brain history

on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astarter-public-brain-history
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'brunopike/astarter-bnb-bangkok' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: src/astarter-frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install archive readers
        run: python -m pip install --disable-pip-version-check requests cbor2 pyarrow msgpack lz4 openpyxl
      - name: Update finalized chain history
        id: chains
        continue-on-error: true
        run: python scripts/update-brain-chains.py
      - name: Update market history
        id: markets
        continue-on-error: true
        run: python scripts/update-brain-markets.py
      - name: Validate and stage referenced chain files
        id: chaincheck
        continue-on-error: true
        run: |
          python scripts/mirror-brain-history.py --check-local brain-evidence --group archive --path-list "$RUNNER_TEMP/chain-paths"
          git add --pathspec-from-file="$RUNNER_TEMP/chain-paths" --pathspec-file-nul
      - name: Validate and stage referenced market files
        id: marketcheck
        continue-on-error: true
        run: |
          python scripts/mirror-brain-history.py --check-local brain-evidence --group tradfi --path-list "$RUNNER_TEMP/market-paths"
          git add --pathspec-from-file="$RUNNER_TEMP/market-paths" --pathspec-file-nul
      - name: Publish verified changes
        if: steps.chaincheck.outcome == 'success' || steps.marketcheck.outcome == 'success'
        run: |
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Refresh public block and market history"
          data_commit=$(git rev-parse HEAD)
          git fetch --no-tags origin main
          # A concurrently changed source file in a rejected group must never enter the publication.
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            git push origin HEAD:refs/heads/main
          else
            git worktree add --detach "$RUNNER_TEMP/history-publisher" FETCH_HEAD
            git -C "$RUNNER_TEMP/history-publisher" cherry-pick "$data_commit"
            git -C "$RUNNER_TEMP/history-publisher" push origin HEAD:refs/heads/main
          fi
      - name: Report incomplete updates
        if: >-
          !cancelled() && (steps.chains.outcome != 'success' || steps.markets.outcome != 'success' ||
          steps.chaincheck.outcome != 'success' || steps.marketcheck.outcome != 'success')
        run: |
          echo "::error::An update or verification failed. Independently verified changes were eligible for publication."
          exit 1
